# Experiment 3 - expose the Deployment. NodePort 30080 on the cluster node;
# on minikube use:  minikube service btms-api -n btms --url
apiVersion: v1
kind: Service
metadata:
  name: btms-api
  namespace: btms
  labels:
    app: btms-api
spec:
  type: NodePort
  selector:
    app: btms-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
